<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calaland | Sündmused</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;
            background: #080305;
            overflow-x: hidden;
        }

        /* TAUST */

        .background {
            position: fixed;
            inset: -8%;

            width: 116%;
            height: 116%;

            background-image: url("./calaland-logo.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(14px);

            opacity: 0.23;

            transform: scale(1.05);

            z-index: -3;
        }

        .dark-overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(8, 2, 4, 0.68),
                    rgba(8, 2, 4, 0.90)
                );

            z-index: -2;
        }

        .red-glow {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 30, 30, 0.15),
                    transparent 50%
                );

            z-index: -1;
        }


        /* NAVIGATSIOON */

        .navbar {
            position: fixed;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            width: min(1150px, calc(100% - 30px));

            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            background: rgba(12, 6, 8, 0.74);

            border: 1px solid rgba(255, 70, 70, 0.28);

            border-radius: 18px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 0 30px rgba(255, 30, 30, 0.12);

            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            text-decoration: none;
            color: white;

            font-family: "Orbitron", sans-serif;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .brand img {
            width: 42px;
            height: 42px;

            object-fit: cover;

            border-radius: 11px;

            box-shadow:
                0 0 18px rgba(255, 35, 35, 0.55);
        }

        .nav-links {
            display: flex;
            align-items: center;

            gap: 5px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }

        .nav-links a {
            color: rgba(255,255,255,0.78);

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            padding: 9px 12px;

            border-radius: 10px;

            transition: 0.25s ease;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: white;

            background: rgba(255, 40, 40, 0.14);

            text-shadow:
                0 0 12px rgba(255, 60, 60, 0.9);
        }


        /* SISU */

        main {
            min-height: 100vh;

            padding: 145px 25px 80px;

            display: flex;
            justify-content: center;
        }

        .container {
            width: min(1000px, 100%);
        }


        /* PEALKIRI */

        .header {
            text-align: center;

            margin-bottom: 45px;
        }

        .small-title {
            color: #ffb0b0;

            font-family: "Orbitron", sans-serif;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-shadow:
                0 0 15px rgba(255, 45, 45, 0.8);
        }

        .header h1 {
            margin-top: 12px;

            font-family: "Orbitron", sans-serif;

            font-size: clamp(48px, 9vw, 100px);

            line-height: 1;

            font-weight: 900;

            text-shadow:
                0 0 8px white,
                0 0 25px rgba(255, 35, 35, 1),
                0 0 60px rgba(255, 20, 20, 0.6);
        }

        .subtitle {
            margin-top: 14px;

            color: rgba(255,255,255,0.72);

            font-size: 17px;
        }


        /* POLE SÜNDMUSI */

        .no-events {
            position: relative;

            padding: 65px 30px;

            text-align: center;

            background: rgba(10, 5, 7, 0.68);

            border: 1px solid rgba(255, 75, 75, 0.25);

            border-radius: 22px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.40),
                0 0 35px rgba(255, 30, 30, 0.07);

            overflow: hidden;
        }

        .no-events::before {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: 3px;

            background: #ff3030;

            box-shadow:
                0 0 18px rgba(255, 40, 40, 0.85);
        }

        .no-events-icon {
            font-size: 48px;

            margin-bottom: 20px;

            filter:
                drop-shadow(0 0 12px rgba(255, 40, 40, 0.6));
        }

        .no-events h2 {
            font-family: "Orbitron", sans-serif;

            font-size: clamp(19px, 3vw, 28px);

            line-height: 1.35;

            margin-bottom: 15px;

            text-shadow:
                0 0 15px rgba(255, 40, 40, 0.45);
        }

        .no-events p {
            max-width: 650px;

            margin: 0 auto;

            color: rgba(255,255,255,0.67);

            font-size: 14px;

            line-height: 1.8;
        }


        /* MOBIIL */

        @media (max-width: 760px) {

            .navbar {
                align-items: flex-start;
            }

            .brand span {
                display: none;
            }

            .nav-links a {
                padding: 7px 8px;
                font-size: 11px;
            }

            .no-events {
                padding: 50px 20px;
            }

        }

    </style>
</head>

<body>

    <!-- TAUST -->

    <div class="background"></div>
    <div class="dark-overlay"></div>
    <div class="red-glow"></div>


    <!-- NAVIGATSIOON -->

    <nav class="navbar">

        <a href="index.html" class="brand">

            <img
                src="calaland-logo.png"
                alt="Calalandi logo"
            >

            <span>CALALAND</span>

        </a>


        <div class="nav-links">

            <a href="index.html">
                Avaleht
            </a>

            <a href="minecraft.html">
                Minecraft
            </a>

            <a href="juhtkond.html">
                Juhtkond
            </a>

            <a href="reeglid.html">
                Reeglid
            </a>

            <a href="uudised.html">
                Uudised
            </a>

            <a href="syndmused.html" class="active">
                Sündmused
            </a>

            <a href="discord.html">
                Discord
            </a>

        </div>

    </nav>


    <!-- SISU -->

    <main>

        <div class="container">

            <header class="header">

                <div class="small-title">
                    CALALANDI ÜRITUSED
                </div>

                <h1>
                    SÜNDMUSED
                </h1>

                <p class="subtitle">
                    Vaata tulevasi ja toimuvaid Calalandi sündmusi.
                </p>

            </header>


            <div class="no-events">

                <div class="no-events-icon">
                    📅
                </div>

                <h2>
                    HETKEL SÜNDMUSI TULEKUL POLE
                </h2>

                <p>
                    Hetkel ei ole Calalandis ühtegi tulevat sündmust.
                    Uued sündmused lisatakse siia siis, kui neid tekib.
                </p>

            </div>

        </div>

    </main>

</body>

</html>
