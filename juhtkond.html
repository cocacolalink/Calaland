<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calaland | Juhtkond</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;
            background: #090507;
            overflow-x: hidden;
        }

        /* TAUST */

        .background-logo {
            position: fixed;
            inset: -8%;

            width: 116%;
            height: 116%;

            object-fit: cover;
            object-position: center;

            filter: blur(14px);
            opacity: 0.25;

            transform: scale(1.05);

            z-index: -3;
        }

        .background-overlay {
            position: fixed;
            inset: 0;

            background: rgba(8, 3, 5, 0.32);

            z-index: -2;
        }

        .red-glow {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 35, 35, 0.14),
                    transparent 55%
                );

            z-index: -1;
        }

        /* NAV */

        .navbar {
            position: fixed;
            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            width: min(1150px, calc(100% - 30px));

            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            background: rgba(12, 6, 8, 0.72);

            border: 1px solid rgba(255, 70, 70, 0.28);

            border-radius: 18px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 0 30px rgba(255, 30, 30, 0.12);

            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            text-decoration: none;
            color: white;

            font-family: "Orbitron", sans-serif;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand img {
            width: 42px;
            height: 42px;

            object-fit: cover;

            border-radius: 11px;

            box-shadow:
                0 0 18px rgba(255, 35, 35, 0.55);
        }

        .nav-links {
            display: flex;
            align-items: center;

            gap: 5px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }

        .nav-links a {
            color: rgba(255,255,255,0.78);

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            padding: 9px 12px;

            border-radius: 10px;

            transition: 0.25s ease;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: white;

            background: rgba(255, 40, 40, 0.14);

            text-shadow:
                0 0 12px rgba(255, 60, 60, 0.9);
        }

        /* SISU */

        main {
            min-height: 100vh;

            padding: 145px 25px 80px;

            display: flex;
            justify-content: center;
        }

        .container {
            width: min(1000px, 100%);
        }

        .header {
            text-align: center;

            margin-bottom: 45px;
        }

        .small-title {
            color: #ffb0b0;

            font-family: "Orbitron", sans-serif;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            text-shadow:
                0 0 15px rgba(255, 45, 45, 0.8);
        }

        .header h1 {
            margin-top: 12px;

            font-family: "Orbitron", sans-serif;

            font-size: clamp(48px, 9vw, 100px);

            line-height: 1;

            font-weight: 900;

            color: white;

            text-shadow:
                0 0 8px white,
                0 0 25px rgba(255, 35, 35, 1),
                0 0 60px rgba(255, 20, 20, 0.6);
        }

        .subtitle {
            margin-top: 14px;

            color: rgba(255,255,255,0.72);

            font-size: 17px;
        }

        /* JUHTKOND */

        .section-title {
            margin: 45px 0 20px;

            text-align: center;

            color: rgba(255,255,255,0.75);

            font-family: "Orbitron", sans-serif;

            font-size: 18px;

            letter-spacing: 1px;
        }

        .staff-grid {
            display: grid;

            grid-template-columns: repeat(4, minmax(0, 1fr));

            gap: 18px;

            align-items: stretch;
        }

        .staff-card {
            width: 100%;
            min-height: 190px;

            padding: 28px 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: rgba(12, 7, 9, 0.70);

            border: 1px solid rgba(255, 75, 75, 0.23);

            border-radius: 20px;

            backdrop-filter: blur(14px);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.30);

            transition: 0.25s ease;

            overflow: hidden;
        }

        .staff-card:hover {
            transform: translateY(-5px);

            border-color: rgba(255, 95, 95, 0.45);

            box-shadow:
                0 20px 55px rgba(255, 30, 30, 0.10);
        }

        .staff-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            border-radius: 18px;

            background: rgba(255, 40, 40, 0.10);

            border: 1px solid rgba(255, 80, 80, 0.20);

            font-size: 35px;
        }

        .staff-name {
            font-family: "Orbitron", sans-serif;

            font-size: 17px;

            font-weight: 800;

            margin-bottom: 8px;

            white-space: nowrap;
        }

        .staff-role {
            color: #ffaaaa;

            font-family: "Orbitron", sans-serif;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;
        }

        /* OMANIK */

        .owner-grid {
            display: flex;

            justify-content: center;
        }

        .owner-card {
            width: min(250px, 100%);

            border-color: rgba(255, 175, 70, 0.38);

            background:
                linear-gradient(
                    145deg,
                    rgba(55, 20, 7, 0.48),
                    rgba(12, 7, 9, 0.72)
                );
        }

        .owner-card .staff-icon {
            background: rgba(255, 175, 70, 0.10);

            border-color: rgba(255, 190, 80, 0.24);
        }

        .owner-card .staff-role {
            color: #ffd28a;
        }

        /* MOBIIL */

        @media (max-width: 900px) {

            .staff-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .navbar {
                align-items: flex-start;
            }

            .brand span {
                display: none;
            }

            .nav-links a {
                padding: 7px 8px;
                font-size: 11px;
            }

            .staff-grid {
                grid-template-columns: 1fr;
            }

            .staff-name {
                white-space: normal;
            }

        }

    </style>
</head>

</body>
</html>
